<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. pastel</title>
</head>
<body>
        <header>
        <div class="container header-content">
            <div class="logo">
                <img src="/PasteleriaMilSabores/images/logo.png" alt="Pastelería 1000 Sabores" >
                <h1>1000 Sabores</h1>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="/PasteleriaMilSabores/pages/tienda/productos.html">Productos</a></li>
                    <li><a href="/PasteleriaMilSabores/pages/tienda/nosotros.html">Nosotros</a></li>
                    <li><a href="/PasteleriaMilSabores/pages/tienda/blog.html">Blogs</a></li>
                    <li><a href="/PasteleriaMilSabores/pages/tienda/contacto.html">Contacto</a></li>
                </ul>
            </nav>
            <div class="header-icons">
                <a href="carrito.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
                <a href="login.html" class="login-link">Login / Registro</a>
            </div>
        </div>
        <br>
    </header>
    
    <main>
        <h2>Inicio de sesión</h2>
        <p>Accede a tu cuenta para continuar</p>
        <br>
        <form action="/inicio_sesion" method="POST">
            <fieldset>
                
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <br>
                    <input type="email" id="correo" name="correo" required placeholder="ejemplo@email.com">
                </div>

                <div class="form-group">
                <label for="contraseña">Contraseña</label>
                <br>
                <input type="password" id="contraseña" name="contraseña" required placeholder="********" autocomplete="off">
                </div>

                <div class="form-group form-remember">
                    <label>
                        <input type="checkbox" name="remember">
                            Recordarme
                    </label>
                </div>
                
                <div class="form-actions">
                    <button type="submit">Iniciar sesión</button>
                    <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
                </div>

            </fieldset>
        </form>
    </main>
    
</body>
</html>
