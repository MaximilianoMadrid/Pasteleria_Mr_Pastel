<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/PasteleriaMilSabores/CSS/estilos.css">
    <title>Login - Mr. pastel</title>
</head>
<body>
        <header>
        <div class="container header-content">
            <div class="logo">
                <img src="/PasteleriaMilSabores/images/logo.png" alt="Pastelería 1000 Sabores" >
                <h1>Mr. Pastel</h1>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="/PasteleriaMilSabores/index.html" class="active">Home</a></li>
                    <li><a href="/PasteleriaMilSabores/pages/tienda/productos.html">Productos</a></li>
                    <li><a href="/PasteleriaMilSabores/pages/tienda/nosotros.html">Nosotros</a></li>
                    <li><a href="/PasteleriaMilSabores/pages/tienda/blog.html">Blogs</a></li>
                    <li><a href="/PasteleriaMilSabores/pages/tienda/contacto.html">Contacto</a></li>
                </ul>
            </nav>
            <div class="header-icons">
                <a href="carrito.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
                <a href="/PasteleriaMilSabores/pages/tienda/login.html" class="login-link">Login</a>
                <a href="/PasteleriaMilSabores/pages/tienda/registro.html" class="login-link">Registro</a>
            </div>
        </div>
        <br>
    </header>
    
    <main class="container login-page">
    <h2>Inicio de sesión</h2>
    <p class="lp-intro">Accede a tu cuenta para continuar</p>

    <form action="/inicio_sesion" method="POST" class="login-form" novalidate>
        <fieldset>
        <legend>Datos de acceso</legend>

        <div class="login-grid">
            <div class="lg-group">
            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                name="correo"
                required
                placeholder="ejemplo@email.com"
                autocomplete="email"
            >
            </div>

            <div class="lg-group">
            <label for="contrasena">Contraseña</label>
            <input
                type="password"
                id="contrasena"
                name="contrasena"
                required
                placeholder="********"
                autocomplete="current-password"
                minlength="6"
            >
            </div>

            <div class="lg-group lg-remember">
            <label>
                <input type="checkbox" name="remember" value="1">
                Recordarme
            </label>
            </div>

            <div class="lg-actions --full">
            <button type="submit" class="lg-btn lg-btn--primary">Iniciar sesión</button>
            <a href="recuperar.html" class="lp-link">¿Olvidaste tu contraseña?</a>
            </div>

            <p class="lp-switch --full">
            ¿No tienes cuenta?
            <a href="/PasteleriaMilSabores/pages/tienda/registro.html" class="lp-link">Regístrate aquí</a>
            </p>
        </div>
        </fieldset>
    </form>
    </main>

</body>
</html>
