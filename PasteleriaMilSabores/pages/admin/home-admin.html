<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/PasteleriaMilSabores/CSS/admin.css">
  <title>Panel de Administración | Mr. Pastel</title>
</head>





<body>
  <!-- Enlace de salto para accesibilidad -->
  <a href="#contenido-principal" class="salto-contenido">Saltar al contenido</a>

  <!-- Encabezado corporativo -->
  <header role="banner" aria-label="Encabezado principal" class="admin-header">
    <div class="admin-header__wrap">
      <div class="marca">
        <a href="./index.html" class="marca__link" aria-label="Ir al inicio del panel">
          <img src="/PasteleriaMilSabores/images/logo.png" alt="Logo de Mr. Pastel" class="marca__logo">
          <span class="marca__nombre">Mr. Pastel</span>
        </a>
      </div>

      <!-- Acciones de usuario -->
      <nav class="header-acciones" aria-label="Acciones de usuario">
        <ul>
          <li><a href="./perfil.html">Mi perfil</a></li>
          <li><a href="./ajustes.html">Ajustes</a></li>
          <li><a href="./cerrar-sesion.html">Cerrar sesión</a></li>
        </ul>
      </nav>

      <!-- Botón para mostrar/ocultar menú lateral en móvil (JS después) -->
      <button class="btn-menu" type="button" aria-controls="menu-lateral" aria-expanded="false" aria-label="Mostrar u ocultar menú lateral">
        ☰
      </button>
    </div>
  </header>

  <div class="admin-layout">
    <!-- Menú lateral (izquierdo) -->
    <aside id="menu-lateral" class="menu-lateral" role="navigation" aria-label="Menú lateral del administrador">
      <div class="menu-lateral__seccion">
        <p class="menu-lateral__titulo">Navegación</p>
        <ul class="menu-lateral__lista">
          <li><a href="./index.html" aria-current="page">🏠 Inicio</a></li>
          <li><a href="./usuarios.html">👤 Usuarios</a></li>
          <li><a href="./nuevo-usuario.html">➕ Nuevo Usuario</a></li>
          <li><a href="./productos.html">🧁 Productos</a></li>
          <li><a href="./pedidos.html">🛒 Pedidos</a></li>
          <li><a href="./reportes.html">📈 Reportes</a></li>
          <li><a href="./ajustes.html">⚙️ Ajustes</a></li>
        </ul>
      </div>

      <div class="menu-lateral__seccion">
        <p class="menu-lateral__titulo">Ayuda</p>
        <ul class="menu-lateral__lista">
          <li><a href="./soporte.html">Soporte</a></li>
          <li><a href="./documentacion.html">Documentación</a></li>
        </ul>
      </div>
    </aside>

    <!-- Contenido principal (solo el saludo) -->
    <main id="contenido-principal" class="admin-contenido" role="main" aria-labelledby="bienvenida-titulo">
      <section class="bloque">
        <header class="bloque__header">
          <h1 id="bienvenida-titulo">Bienvenido/a al Panel de Administración</h1>
        </header>
        <!-- Zona central vacía a propósito; aquí no mostramos tarjetas ni tablas -->
      </section>
    </main>
  </div>

  <!-- Pie de página corporativo (sin cambios) -->
  <footer role="contentinfo" aria-label="Información del sitio" class="admin-footer">
    <div class="admin-footer__wrap">
      <section aria-label="Información de contacto">
